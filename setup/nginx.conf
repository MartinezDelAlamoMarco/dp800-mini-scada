events {}

http {
    server {
        # Solo en local, para no exponer Ollama a la red
        listen 127.0.0.1:11435 ssl;
        server_name localhost;

        ssl_certificate     C:/certs/localhost+2.pem;
        ssl_certificate_key C:/certs/localhost+2-key.pem;

        location / {
            proxy_pass http://127.0.0.1:11434;
            proxy_set_header Host localhost:11434;
            # Generar texto con el modelo de lenguaje tarda mas que un embedding
            proxy_read_timeout 300s;
        }
    }
}
